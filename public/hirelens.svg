<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="lensRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <filter id="lensGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0072FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Document / Resume Group -->
  <g filter="url(#dropShadow)">
    <!-- Main Body Path with Fold Cutout -->
    <path d="M 140 60 
             H 300 
             L 370 130 
             V 420 
             A 20 20 0 0 1 350 440 
             H 140 
             A 20 20 0 0 1 120 420 
             V 80 
             A 20 20 0 0 1 140 60 Z" 
          fill="url(#docGrad)" />

    <!-- Folded Corner Notch -->
    <path d="M 300 60 
             V 115 
             A 15 15 0 0 0 315 130 
             H 370 Z" 
          fill="url(#foldGrad)" />

    <!-- Resume Header Placeholder (Avatar + Name Line) -->
    <circle cx="170" cy="135" r="20" fill="#94A3B8" />
    <rect x="205" y="123" width="75" height="10" rx="5" fill="#64748B" />
    <rect x="205" y="139" width="45" height="8" rx="4" fill="#94A3B8" />

    <!-- Resume Content Lines -->
    <rect x="150" y="185" width="170" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="208" width="150" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="231" width="160" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="254" width="120" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="277" width="140" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="300" width="100" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="323" width="160" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="346" width="130" height="8" rx="4" fill="#CBD5E1" />
    <rect x="150" y="369" width="110" height="8" rx="4" fill="#CBD5E1" />
  </g>

  <!-- Magnifying Lens Group -->
  <g filter="url(#lensGlow)">
    <!-- Lens Handle -->
    <rect x="340" y="340" width="30" height="100" rx="15" 
          transform="rotate(-45 340 340)" 
          fill="url(#handleGrad)" />

    <!-- Outer Ring -->
    <circle cx="290" cy="290" r="95" fill="url(#lensRingGrad)" />

    <!-- Inner Glass Lens -->
    <circle cx="290" cy="290" r="72" fill="#FFFFFF" />

    <!-- Highlighted AI Verified Checkmark Inside Lens -->
    <path d="M 255 292 L 278 315 L 328 265" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Glass Reflection Highlight -->
    <path d="M 230 260 A 72 72 0 0 1 320 225" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-opacity="0.6" 
          stroke-width="6" 
          stroke-linecap="round" />
  </g>
</svg>
